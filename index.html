    // --- Dynamic Starry Night Sky Canvas Animation ---
    window.onload = function() {
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      let stars = [];
      const numStars = 100;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      window.addEventListener('resize', resize);
      resize();

      // Create initial stars
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5,
          color: `rgba(229, 169, 59, ${Math.random() * 0.7 + 0.3})`,
          twinkleSpeed: Math.random() * 0.04 + 0.01,
          angle: Math.random() * Math.PI * 2
        });
      }

      // Shooting stars logic
      let shootingStar = null;
      function triggerShootingStar() {
        shootingStar = {
          x: Math.random() * canvas.width * 0.5,
          y: 0,
          dx: Math.random() * 4 + 4,
          dy: Math.random() * 3 + 3,
          length: Math.random() * 80 + 40,
          opacity: 1
        };
      }

      // Start loop
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw and update stars
        stars.forEach(star => {
          star.angle += star.twinkleSpeed;
          const currentOpacity = Math.abs(Math.sin(star.angle));
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
          ctx.fillStyle = star.color.replace(/[^,]+(?=\))/, currentOpacity);
          ctx.fill();
        });

        // Trigger shooting star occasionally
        if (!shootingStar && Math.random() < 0.005) {
          triggerShootingStar();
        }

        // Draw and update shooting star
        if (shootingStar) {
          ctx.beginPath();
          const gradient = ctx.createLinearGradient(
            shootingStar.x, shootingStar.y, 
            shootingStar.x - shootingStar.dx * (shootingStar.length / 10), 
            shootingStar.y - shootingStar.dy * (shootingStar.length / 10)
          );
          gradient.addColorStop(0, `rgba(229, 169, 59, ${shootingStar.opacity})`);
          gradient.addColorStop(1, 'rgba(229, 169, 59, 0)');
          
          ctx.strokeStyle = gradient;
          ctx.lineWidth = 2;
          ctx.moveTo(shootingStar.x, shootingStar.y);
          ctx.lineTo(
            shootingStar.x - shootingStar.dx * (shootingStar.length / 5), 
            shootingStar.y - shootingStar.dy * (shootingStar.length / 5)
          );
          ctx.stroke();

          // Move
          shootingStar.x += shootingStar.dx;
          shootingStar.y += shootingStar.dy;
          shootingStar.opacity -= 0.015;

          if (shootingStar.opacity <= 0 || shootingStar.x > canvas.width || shootingStar.y > canvas.height) {
            shootingStar = null;
          }
        }

        requestAnimationFrame(animate);
      }

      // Initialize animation
      animate();
    };
  </script>
